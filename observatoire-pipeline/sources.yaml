# Manifeste des sources de données mobilisées par le Carnet de données — souveraineté culturelle numérique.
# (Anciennement « Observatoire de la souveraineté culturelle numérique » jusqu'au 2026-06-12.)
# Chaque entrée décrit un tableau ISQ attendu, son URL permanente, sa classification,
# et la fonction d'extraction qui le transforme en JSON normalisé.
#
# Convention de nommage : on accepte les noms tels qu'ils sont téléchargés de l'ISQ ; le pipeline
# repère les fichiers via un motif `file_pattern` (glob). Si plusieurs fichiers correspondent,
# le plus récent (selon mtime) est retenu, et le ledger trace lequel a été utilisé.
#
# Les URL sont indicatives : elles pointent vers les fiches ISQ correspondantes. Le pipeline ne
# les utilise pas pour télécharger automatiquement (l'accès est manuel).

# Dossier où le pipeline cherche les fichiers .xlsx ISQ. Chemin relatif à la racine du dépôt,
# ou absolu. Par défaut : ../Données Québec/ (un dossier au-dessus du dépôt) — c'est l'organisation
# recommandée : tu télécharges les fichiers ISQ dans Données Québec/, le pipeline les y trouve,
# pas de duplication, pas de divergence.
# Pour un setup self-contained classique, mettre simplement : raw_data_dir: "data/raw"
raw_data_dir: "../Données Québec"

sources:

  part_qc:
    label: "Part des interprètes du Québec dans la consommation d'enregistrements musicaux"
    isq_table_id: "4153"
    file_pattern: "Part des interprètes*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/part-interpretes-quebec-consommation-enregistrements-musicaux"
    classification: "OCCQ — données hebdomadaires"
    extractor: extract_part_qc
    axe_tdb: ["consommation"]

  volume_musique:
    label: "Consommation d'enregistrements musicaux selon le type de produit"
    isq_table_id: "2140"
    file_pattern: "Consommation d'enregistrements musicaux*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/consommation-enregistrements-musicaux-type-produit"
    classification: "OCCQ — données hebdomadaires"
    extractor: extract_volume_musique
    axe_tdb: ["consommation", "presence"]

  cinema_pays:
    label: "Résultats d'exploitation des établissements cinématographiques selon le pays d'origine des films (hebdomadaire)"
    isq_table_id: "3059"
    # Pattern resserré : « hebdomadaires » obligatoire pour éviter de matcher
    # le nouveau fichier annuel (cinema_pays_annuel) qui partage le préfixe.
    file_pattern: "Résultats d'exploitation des établissements*pays d'origine*hebdomadaires*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/resultats-exploitation-cinemas-pays-origine"
    classification: "OCCQ — données hebdomadaires"
    extractor: extract_cinema_pays
    axe_tdb: ["consommation"]

  palmares_top20:
    label: "Palmarès des enregistrements musicaux"
    isq_table_id: "2620"
    file_pattern: "Palmarès des enregistrements*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/palmares-enregistrements-musicaux"
    classification: "OCCQ — cumulatif annuel"
    extractor: extract_palmares
    axe_tdb: ["decouvrabilite"]

  evolution_stats:
    label: "Évolution de statistiques clés de la culture et des communications"
    isq_table_id: "3171"
    file_pattern: "Évolution de statistiques clés*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/evolution-statistiques-cles-culture-communications"
    classification: "OCCQ — séries annuelles 2002-2025"
    extractor: extract_evolution
    axe_tdb: ["presence", "ecosysteme"]

  emplois_eerh:
    label: "Emplois salariés dans certaines industries de la culture et des communications (EERH) — données mensuelles MM3"
    isq_table_id: "2576"
    # Pattern resserré : « données mensuelles » obligatoire pour ne plus matcher
    # le nouveau fichier annuel (emplois_eerh_annuel) qui partage le préfixe.
    file_pattern: "Emplois salariés*données mensuelles*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/2576"
    classification: "SCIAN 2022 — désaisonnalisé, MM3 ; année courante (YTD)"
    extractor: extract_emplois_eerh
    axe_tdb: ["ecosysteme"]
    notes: "Tableau 2576. Mois « (À venir) » tolérés ; l'extracteur calcule la variation Jan → dernier mois disponible et expose l'année de référence et le nombre de mois disponibles."

  emplois_eerh_annuel:
    label: "Emplois salariés dans certaines industries de la culture et des communications (EERH) — données annuelles 2001-2025"
    file_pattern: "Emplois salariés*données annuelles*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/emplois-salaries-culture-communications-annuel"
    classification: "SCIAN 2022 — moyennes annuelles 2001-"
    extractor: extract_emplois_eerh_annuel
    axe_tdb: ["ecosysteme"]
    notes: "Série annuelle EERH portée par le Québec. Sert de baseline figée pour les variations 2025 quand le fichier mensuel passe en année courante (YTD)."

  remunerations_eerh_statcan:
    label: "Rémunération hebdomadaire moyenne (EERH) — Québec, secteurs SCIAN 2 chiffres, mensuel désaisonnalisé"
    file_pattern: "14100223*.zip"
    isq_url: "https://www150.statcan.gc.ca/t1/tbl1/fr/tv.action?pid=1410022301"
    classification: "Statistique Canada CANSIM 14-10-0223 — EERH ; mensuel désaisonnalisé ; SCIAN 2 chiffres provincial"
    extractor: extract_remunerations_eerh_statcan
    axe_tdb: ["ecosysteme"]
    notes: "Source Statistique Canada (et non ISQ) parce que l'ISQ ne diffuse pas le volet rémunération de l'EERH pour le Québec dans le thème culture. Limite : granularité SCIAN 2 chiffres uniquement ([51] Information/culture, [71] Arts-spectacles-loisirs). Sert la lentille 3 « rémunération » de l'analyse AI-exposure, en complément des effectifs de emplois_eerh_annuel (qui descend au niveau 4 chiffres mais ne contient pas la rémunération)."

  aei_canada:
    label: "Anthropic Economic Index — Claude.ai Canada, semaine du 5-12 février 2026"
    file_pattern: "aei_raw_claude_ai_*.csv"
    isq_url: "https://huggingface.co/datasets/Anthropic/EconomicIndex/tree/main/release_2026_03_24"
    classification: "Anthropic Economic Index — 5e édition, release 2026-03-24 ; usage Claude.ai Free/Pro/Max ; ventilation par tâche O*NET et par mode de collaboration"
    extractor: extract_aei_canada
    axe_tdb: ["ecosysteme"]
    notes: "Sert la lentille 2 « usage révélé » de l'analyse AI-exposure. Granularité Canada national (pas de coupe Québec dans la release). L'intersection onet_task::collaboration n'est exposée que pour la géographie GLOBAL (filtre vie privée Anthropic) ; on a donc le breakdown collaboration agrégé toutes tâches confondues pour le Canada, sans ventilation par tâche. Périmètre créatif au sens du Carnet : 13 tâches O*NET retenues (7 cœur culturel + 6 contenu écrit). Licence CC-BY."

  job_vacancy_quebec:
    label: "Postes vacants, taux et salaire horaire offert (JVWS) — Québec, SCIAN 3 chiffres, trimestriel"
    file_pattern: "14100442*.zip"
    isq_url: "https://www150.statcan.gc.ca/t1/tbl1/fr/tv.action?pid=1410044201"
    classification: "Statistique Canada CANSIM 14-10-0442 — Enquête sur les postes vacants et les salaires (JVWS) ; trimestriel non désaisonnalisé ; SCIAN 3 chiffres provincial"
    extractor: extract_job_vacancy_quebec
    axe_tdb: ["ecosysteme"]
    notes: "Sert la sous-lentille 1b « demande marché » de l'analyse AI-exposure. Granularité SCIAN 3 chiffres, intermédiaire entre les effectifs ISQ niveau 4 et la rémunération EERH niveau 2. Couvre 512, 513, 516, 519, 711, 712 ; SCIAN 515 archivé. Métrique clé : « moyenne du salaire horaire offert » dans les postes vacants — distinct du salaire EERH versé aux salariés en place. L'écart entre les deux est un signal de tension du marché."

  ai_exposure_culture:
    label: "Exposition occupationnelle à l'IA dans les industries culturelles — Canada, indice C-AIOE"
    file_pattern: "ai_exposure_culture*.csv"
    isq_url: "https://www150.statcan.gc.ca/n1/pub/36-28-0001/2026003/article/00003-eng.htm"
    classification: "Statistique Canada Economic and Social Reports — Mehdi, Allen, Lesica & Watt (mars 2026) ; indice C-AIOE Felten + Pizzinelli ; données 2021 Census + CEEDD ; ventilation par industrie et par sexe"
    extractor: extract_ai_exposure_culture
    axe_tdb: ["ecosysteme"]
    notes: "Sert la sous-lentille 1a « demande experte » de l'analyse AI-exposure. Cinq industries culturelles canadiennes ventilées en trois catégories d'exposition (substitution potentielle, augmentation potentielle, faible exposition). Granularité Canada national (pas de Québec). Données 2021. Le fichier CSV est compilé à partir du tableau Chart 1 de l'article StatCan, sous licence ouverte Statistics Canada. À actualiser quand StatCan publiera la prochaine vague."

  ventes_livres:
    label: "Variations mensuelles et annuelles des ventes de livres neufs"
    isq_table_id: "2342"
    file_pattern: "Variations mensuelles*ventes de livres*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/variations-ventes-livres-neufs"
    classification: "OCCQ — données mensuelles, ventes finales, $ courants"
    extractor: extract_ventes_livres
    axe_tdb: ["consommation", "ecosysteme"]
    notes: "Hiérarchie : Ventes totales → Éditeurs / Distributeurs / Librairies → sous-catégories par type de librairie."

  ventes_categorie:
    label: "Ventes de livres neufs selon la catégorie de points de vente, données mensuelles"
    file_pattern: "Ventes de livres neufs*points de vente*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/2341"
    classification: "OCCQ — données mensuelles, $ courants, ventes finales"
    extractor: extract_ventes_categorie
    axe_tdb: ["consommation", "ecosysteme"]
    notes: "Série mensuelle ventilée par catégorie de points de vente : éditeurs, distributeurs, librairies (agréées / à succursales / indépendantes), grande diffusion. Tableau ISQ 2341."

  ventes_livres_numeriques:
    label: "Ventes de livres numériques, données annuelles, Québec"
    isq_table_id: "3408"
    file_pattern: "Ventes de livres numériques*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/3408"
    classification: "OCCQ — séries annuelles 2014-2025 ; valeur au prix consommateur avant taxes ; inclut gratuit et autoédités"
    extractor: extract_ventes_livres_numeriques
    axe_tdb: ["consommation", "ecosysteme"]
    notes: "Méthodologie Optique culture no 41. Trois métriques : nombre d'exemplaires, valeur des ventes en $, prix moyen en $. La série fait apparaître un pic massif en 2020 (894 531 exemplaires, prix moyen 11,74 $) qui combine effet confinement et forte part de gratuits — à interpréter avec prudence dans les comparaisons annuelles."

  calq_theatre_cirque:
    label: "Statistiques principales des organismes de production en théâtre et arts du cirque soutenus par le CALQ"
    # Le fichier global (Québec.xlsx sans « selon ») ; les 6 ventilations par
    # région / genre / taille sont volontairement exclues pour cette phase.
    file_pattern: "Statistiques principales des organismes de production en théâtre et arts du cirque soutenus par le Conseil des arts et des lettres du Québec, Québec.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/statistiques-principales-organismes-production-theatre-cirque-calq"
    classification: "OCCQ — CALQ ; série annuelle fiscale 1994-1995 à 2023-2024 ; bloc Activités (productions, représentations, spectateurs QC/hors-QC)"
    extractor: extract_calq_theatre_cirque
    axe_tdb: ["ecosysteme", "presence"]
    notes: "Série longue (30 ans) sur les organismes de production en théâtre et arts du cirque soutenus par le CALQ. Alimente le nouveau repère R6 « Vitalité des arts vivants subventionnés ». Structure : revenus (exploitation + aide privée + aide publique QC/CA/municipal), dépenses (production/administration/mise en marché), activités (productions et représentations n, spectateurs n avec ventilation QC vs hors-Québec). Modification d'univers en 2017-2018 (passage du programme de soutien au fonctionnement vers mission + programmation)."

  calq_diffuseurs_pluridiscip:
    label: "Statistiques principales des diffuseurs pluridisciplinaires soutenus par le CALQ"
    file_pattern: "Statistiques principales des diffuseurs pluridisciplinaires soutenus par le Conseil des arts et des lettres du Québec, Québec.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/statistiques-principales-diffuseurs-pluridisciplinaires-calq"
    classification: "OCCQ — CALQ ; série annuelle fiscale 2016-2017 à 2023-2024 ; bloc Activités (représentations, spectateurs)"
    extractor: extract_calq_diffuseurs_pluridiscip
    axe_tdb: ["ecosysteme", "presence"]
    notes: "Organismes qui diffusent (pas qui produisent) donc pas de série « Nombre de productions ». Bloc Activités limité à Représentations + Spectateurs (total, pas de ventilation QC/hors-QC)."

  calq_arts_visuels:
    label: "Statistiques principales des organismes de diffusion et de production en arts visuels, arts numériques, cinéma et vidéo soutenus à la mission par le CALQ"
    file_pattern: "Statistiques principales des organismes de diffusion et de production en arts visuels, arts numériques, cinéma et vidéo soutenus à la mission par le Conseil des arts et des lettres du Québec, Québec.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/statistiques-principales-organismes-arts-visuels-calq"
    classification: "OCCQ — CALQ ; série annuelle fiscale 2017-2018 à 2023-2024 ; pas de bloc Activités chiffré en n"
    extractor: extract_calq_arts_visuels
    axe_tdb: ["ecosysteme"]
    notes: "Ce tableau ISQ ne publie pas d'indicateurs d'activité chiffrés en n pour cette discipline (expositions, œuvres exposées, projections, etc. n'apparaissent pas dans le tableau global). Seul le nombre d'organismes joue ce rôle de proxy. Contribue au R6 en dimension écosystème financier."

  musicbrainz_artistes_qc:
    label: "Artistes du Québec dans MusicBrainz — présence catalogue et complétude des métadonnées ouvertes"
    file_pattern: "musicbrainz_artistes_qc_*.json"
    isq_url: "https://musicbrainz.org/area/a510b9b1-404d-4e23-8db8-0f6585909ed8"
    classification: "MusicBrainz (MetaBrainz Foundation) — données de base CC0 ; récolte par browse des 9 zones QC (province par ISO CA-QC + 8 villes désambiguïsées) ; refresh via moissonneur_musicbrainz.py"
    extractor: extract_musicbrainz_artistes_qc
    axe_tdb: ["presence", "ecosysteme"]
    notes: "Première source non gouvernementale du pipeline. Univers : 9 731 artistes uniques rattachés au Québec (récolte 2026-07-18). Le taux de liens Spotify (~20 %) est un plancher de complétude des métadonnées ouvertes, pas un taux de présence réelle sur Spotify — nuance centrale pour la lecture Loi 109 (volet métadonnées). Enrichissement Spotify (popularité, followers) en attente : quota API journalier des apps en mode développement insuffisant (403 sur batch + 429 Retry-After 24 h, juillet 2026)."

  part_top200_ventes_2021:
    label: "Part des enregistrements audio québécois parmi les 200 plus vendus (SÉRIE TERMINÉE, 2021)"
    isq_table_id: "2142"
    file_pattern: "Part des enregistrements audio québécois*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/2142"
    classification: "OCCQ — série hebdomadaire TERMINÉE (dernière maj 24 févr. 2022) ; Nielsen Music/MRC Data, compilation ADISQ ; 4 dimensions (artistique/industrielle) × 3 types"
    extractor: extract_part_top200_ventes
    axe_tdb: ["decouvrabilite", "consommation"]
    notes: "Capsule historique de l'ère des VENTES : en cumulatif 2021, 58,9 % des ventes du top 200 étaient québécoises (dimension artistique, ensemble des albums), contre 6,9 % du streaming en 2026 (tableau 4153). La bascule d'ère la plus dramatique du Carnet, à manier avec ses caveats : ventes d'unités vs flux d'écoutes, top 200 vs consommation totale, Nielsen vs Luminate. Le cadre à quatre dimensions (artistique/industrielle) opérationnalise dès 2021 la question définitionnelle du « contenu québécois » que la Loi 109 et la DIMA se disputent aujourd'hui."

  apple_top100_ca:
    label: "Top 100 Apple Music Canada — chansons les plus écoutées, artistes QC marqués"
    file_pattern: "apple_top100_ca_*.json"
    isq_url: "https://rss.marketingtools.apple.com/api/v2/ca/music/most-played/100/songs.json"
    classification: "Apple Music (flux marketing public, sans authentification) ; storefront Canada ; refresh via recolter_apple_top100.py"
    extractor: extract_apple_top100
    axe_tdb: ["decouvrabilite", "consommation"]
    notes: "Pendant Apple du R2 : présence des artistes QC au sommet du palmarès d'une plateforme spécifique, en complément du palmarès ISQ (toutes plateformes) et du palmarès films. Identification QC par croisement de noms normalisés avec la récolte MusicBrainz (faux négatifs possibles, faux positifs improbables). Limite : palmarès par storefront pays (Canada), pas de coupe Québec. Apple n'expose aucune métrique de popularité par artiste dans ses API publiques ; ce flux de palmarès est la seule donnée ouverte disponible."

  aei_cadences:
    label: "Anthropic Economic Index — release Cadences (juin 2026), Québec et Canada"
    file_pattern: "aei_claude_ai_2026-*.csv"
    isq_url: "https://huggingface.co/datasets/Anthropic/EconomicIndex"
    classification: "Anthropic (Hugging Face, dataset public) ; release_2026_06_26 ; format long ; niveaux global/country/subregion ; mensuel avril-mai 2026"
    extractor: extract_aei_cadences
    axe_tdb: ["ecosysteme"]
    notes: "Upgrade majeur de la lentille 2 « usage révélé » : première donnée AEI au niveau Québec (CA-QC), avec ventilation O*NET par tâche et SOC par occupation désormais disponibles en subregion (elles étaient réservées au niveau GLOBAL dans la release de février). Constat d'intégration : les occupations Arts/Design/Entertainment/Media sont le 2e groupe d'usage de Claude au Québec (13,2 %). Piège de dénominateur : usage_pct subregion = part dans le pays ; usage_pct pays = part dans le monde. Ingest pinné sur release_2026_06_26 (schéma variable entre vintages). L'ancienne source aei_canada (février 2026) est conservée pour traçabilité. Périmètre restreint à CA-QC + CAN (Brésil exclu, décision 2026-07-22)."

  palmares_films:
    label: "Palmarès évolutif des films présentés en programme simple, ensemble du Québec"
    file_pattern: "Palmarès évolutif des films*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/palmares-evolutif-films-programme-simple"
    classification: "OCCQ — cumulatif de l'année en cours ; top 20 par assistance ; ensemble des films, ensemble du Québec"
    extractor: extract_palmares_films
    axe_tdb: ["consommation", "presence"]
    notes: "Pendant cinéma du palmarès musical (R2). Top 20 des films par assistance cumulée depuis le début de l'année. Le fichier régional détaillé existe aussi sur le site ISQ mais seul le tableau global est intégré. Note ISQ : redécoupage Montérégie/Estrie au 2021-07-28 (décret 961-2021) pour les lectures régionales. Constat à l'intégration (juillet 2026) : aucun film québécois au top 20 (17 É-U, 2 G-B, 1 France)."

  deezer_artistes_qc:
    label: "Popularité Deezer des artistes du Québec — nb_fan et longue traîne"
    file_pattern: "deezer_artistes_qc_*.json"
    isq_url: "https://api.deezer.com/"
    classification: "API publique Deezer (sans authentification) ; périmètre = artistes MusicBrainz QC avec lien Deezer documenté ; refresh via enrichir_deezer.py"
    extractor: extract_deezer_artistes_qc
    axe_tdb: ["presence", "consommation"]
    notes: "1 203 artistes enrichis (extraction 2026-07-19) sur les 9 731 du catalogue MusicBrainz. nb_fan = proxy de popularité ; Deezer est fort en francophonie, miroir pertinent pour le répertoire QC. Biais de périmètre : seuls les artistes dont la fiche MusicBrainz documente un lien Deezer sont couverts — la longue traîne réelle est encore plus longue. Attribution Deezer requise dans les visualisations."

  etablissements:
    label: "Nombre d'établissements culturels de certains types"
    isq_table_id: "929"
    file_pattern: "Nombre d*établissements culturels*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/nombre-etablissements-culturels"
    classification: "OCCQ — séries annuelles 2004-2024 ; SCACCQ"
    extractor: extract_etablissements
    axe_tdb: ["presence", "ecosysteme"]
    notes: "Salles de spectacle, institutions muséales, centres d'artistes, lieux d'interprétation, etc."

  indicateurs_cinema:
    label: "Indicateurs des résultats d'exploitation des établissements cinématographiques (depuis 1975)"
    isq_table_id: "2736"
    file_pattern: "Indicateurs des résultats d'exploitation*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/indicateurs-cinemas-quebec"
    classification: "OCCQ — séries annuelles 1975-"
    extractor: extract_indicateurs_cinema
    axe_tdb: ["presence", "consommation"]
    notes: "Projections, assistance, recettes, prix d'entrée moyen, entrées par habitant, etc."

  cinema_pays_annuel:
    label: "Résultats d'exploitation des établissements cinématographiques selon le pays d'origine des films — assistance annuelle"
    file_pattern: "Résultats d'exploitation des établissements*pays d'origine*annuelles*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/resultats-exploitation-cinemas-pays-origine-annuelles"
    classification: "OCCQ — séries annuelles 1985-"
    extractor: extract_cinema_pays_annuel
    axe_tdb: ["consommation", "presence"]
    notes: "Assistance (spectateurs) ventilée par pays d'origine du film, série annuelle 1985-. Donne directement le volume absolu — utile pour calculer C_cinema dans R3 sans recourir à une part hebdomadaire."

  cinema_langue:
    label: "Résultats d'exploitation des établissements cinématographiques selon la langue de projection"
    file_pattern: "Résultats d'exploitation des établissements*langue de projection*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/resultats-exploitation-cinemas-langue-projection"
    classification: "OCCQ — séries annuelles 1985-"
    extractor: extract_cinema_langue
    axe_tdb: ["presence"]
    notes: "Projections ventilées « Langue française » vs « Autres que le français » (chacune subdivisée Cinémas / Ciné-parcs). Indicateur direct du marché francophone — central pour la Loi 109."

  cinema_classement:
    label: "Résultats d'exploitation des établissements cinématographiques selon la catégorie de classement des films"
    file_pattern: "Résultats d'exploitation des établissements*catégorie de classement*.xlsx"
    isq_url: "https://statistique.quebec.ca/fr/produit/tableau/resultats-exploitation-cinemas-classement"
    classification: "OCCQ — séries annuelles 1985-"
    extractor: extract_cinema_classement
    axe_tdb: ["consommation"]
    notes: "Projections par classement RCQ (Visa général, 13+, 16+, 18+), série annuelle 1985-."

# Configuration du tableau de bord
dashboard:
  title: "Souveraineté culturelle numérique au Québec"
  subtitle: "Tableau de bord empirique au regard de la Loi 109"
  template: "templates/dashboard.html.tmpl"
  output: "outputs/dashboard.html"
